<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>山西财经大学就业协会 · 青年菁英生涯发展协会报名</title><link rel="stylesheet" href="/style.css?v=20260918-2"><link rel="stylesheet" href="/department.css?v=20260918-2"></head><body><main>
<section class="hero"><div class="organization">山西财经大学就业协会</div><h1>青年菁英生涯发展协会</h1><div class="recruitment">2026 · 招新报名</div><p>认真填写每一项信息，让我们更好地认识你。</p></section>
<section class="form-card"><div class="form-intro"><b>报名信息</b><span>带 * 的项目为必填</span></div><form id="signup" novalidate><div class="two"><label>姓名 *<input name="name" required placeholder="请输入真实姓名"></label><label>年级 *<div class="custom-select" data-required><input type="hidden" name="grade"><button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span>请选择年级</span><i></i></button><div class="select-menu" role="listbox"><button type="button" role="option" data-value="大一">大一</button><button type="button" role="option" data-value="大二">大二</button></div></div></label></div><label>学院 *<input name="college" required placeholder="例如：工商管理学院"></label><label>意向部门 *<div class="custom-select" data-required><input type="hidden" name="department"><button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span>请选择意向部门</span><i></i></button><div class="select-menu" role="listbox"><button type="button" role="option" data-value="办公室">办公室</button><button type="button" role="option" data-value="新媒体">新媒体</button><button type="button" role="option" data-value="项目部">项目部</button><button type="button" role="option" data-value="实践部">实践部</button></div></div></label><label>其他意向部门（可选）<div class="custom-select"><input type="hidden" name="other_department" value=""><button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span>暂不选择</span><i></i></button><div class="select-menu" role="listbox"><button type="button" role="option" data-value="">暂不选择</button><button type="button" role="option" data-value="办公室">办公室</button><button type="button" role="option" data-value="新媒体">新媒体</button><button type="button" role="option" data-value="项目部">项目部</button><button type="button" role="option" data-value="实践部">实践部</button></div></div></label><section class="department-guide" aria-label="部门介绍"><strong>四大部门介绍</strong><div class="department-grid"><article><b>办公室</b><p>社团统筹核心，负责值班、文件、会议等工作，锻炼统筹协调能力。</p></article><article><b>新媒体</b><p>运营官方就业平台，负责推文、海报、信息推送，掌握新媒体运营技能。</p></article><article><b>项目部</b><p>对接校企资源，洽谈合作、策划项目，提升商务沟通与资源整合能力。</p></article><article><b>实践部</b><p>负责活动现场执行、后勤物料，锻炼活动执行与临场应变能力。</p></article></div></section><label>自我介绍 *<textarea name="introduction" required placeholder="请简单介绍你的优势、经历或期待参与的工作"></textarea></label><label>联系方式 *<input name="contact" required placeholder="手机号或微信号"></label><label>备注 <textarea name="note" class="short" placeholder="其他想补充的内容（可选）"></textarea></label><button id="submitBtn">提交报名 <span>→</span></button></form><div id="success" hidden><div>✓</div><h2>报名提交成功</h2><p>感谢你的报名，协会将尽快与你联系。</p><button onclick="location.reload()">再填写一份</button></div></section><footer>山西财经大学就业协会 · 青年菁英生涯发展协会</footer></main><script src="/app.js?v=20260918-1"></script></body></html>
